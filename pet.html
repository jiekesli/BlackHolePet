<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奶龙桌宠</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    #pet-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: grab;
    }
    #pet-canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="pet-canvas" aria-label="奶龙桌宠"></canvas>
  <script src="pet-renderer.js"></script>
</body>
</html>
