<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桌宠设置</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      background: #11141a;
      color: #eef1f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    h1 { margin: 0 0 5px; font-size: 22px; }
    .subtitle { margin: 0 0 22px; color: #9299a8; font-size: 13px; }
    .panel {
      padding: 18px;
      border: 1px solid #2c3240;
      border-radius: 14px;
      background: linear-gradient(145deg, #1b202a, #151922);
      box-shadow: 0 14px 34px rgba(0,0,0,.22);
    }
    .field + .field { margin-top: 20px; }
    .field-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 9px;
    }
    label { font-size: 14px; font-weight: 600; }
    output { color: #f0b779; font: 12px Consolas, monospace; }
    input[type="range"] { width: 100%; accent-color: #df985a; }
    input[type="color"] {
      width: 100%;
      height: 38px;
      padding: 3px;
      border: 1px solid #343b4a;
      border-radius: 9px;
      background: #10131a;
    }
    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #343b4a;
      border-radius: 9px;
      background: #10131a;
      color: #eef1f7;
    }
    .hint { margin: 7px 0 0; color: #7f8796; font-size: 12px; line-height: 1.45; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    button {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #343b4a;
      border-radius: 10px;
      background: #242a35;
      color: #eef1f7;
      cursor: pointer;
    }
    button.primary {
      border-color: #d8894f;
      background: #d8894f;
      color: #17110d;
      font-weight: 700;
    }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <h1>桌宠设置</h1>
  <p class="subtitle">开发者：凌晨曦 · 设置会自动保存</p>
  <section class="panel">
    <div class="field">
      <div class="field-head">
        <label for="size">黑洞大小</label>
        <output id="size-value"></output>
      </div>
      <input id="size" type="range" min="0.06" max="0.22" step="0.005" />
    </div>
    <div class="field">
      <div class="field-head">
        <label for="gravity">鼠标引力</label>
        <output id="gravity-value"></output>
      </div>
      <input id="gravity" type="range" min="0" max="2" step="0.05" />
      <p class="hint">只在黑洞局部范围内生效；设为 0 可完全关闭。</p>
    </div>
    <div class="field">
      <div class="field-head">
        <label for="color">吸积盘颜色</label>
        <output id="color-value"></output>
      </div>
      <input id="color" type="color" />
    </div>
    <div class="field">
      <div class="field-head"><label for="performance">性能模式</label></div>
      <select id="performance">
        <option value="auto">自动</option>
        <option value="quality">高画质 · 60 FPS</option>
        <option value="balanced">均衡 · 45 FPS</option>
        <option value="battery">低功耗 · 30 FPS</option>
      </select>
    </div>
  </section>
  <div class="actions">
    <button id="reset">恢复默认</button>
    <button id="close" class="primary">完成</button>
  </div>
  <script src="settings.js"></script>
</body>
</html>
